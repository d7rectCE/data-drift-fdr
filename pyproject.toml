[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "driftfdr"
version = "0.1.1"
description = "Calibrated p-values and multiplicity control on top of practical drift detectors for monitoring fleets of ML models"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Artem Deviatov"}]
keywords = ["drift detection", "concept drift", "false discovery rate", "multiple testing", "MLOps",
            "model monitoring", "bootstrap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/d7rectCE/data-drift-fdr"
Documentation = "https://github.com/d7rectCE/data-drift-fdr/tree/main/docs"
Changelog = "https://github.com/d7rectCE/data-drift-fdr/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "river>=0.21", "prometheus-client>=0.17"]
datasets = ["river>=0.21", "scikit-learn>=1.3"]
prometheus = ["prometheus-client>=0.17"]
mlflow = ["mlflow-skinny>=2.9"]
nannyml = ["nannyml>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
